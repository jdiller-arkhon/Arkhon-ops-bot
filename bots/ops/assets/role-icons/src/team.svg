<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="lite" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.55" stop-color="#e4e5f0"/><stop offset="1" stop-color="#a9abc2"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#7a7c92"/><stop offset="0.45" stop-color="#3a3b4a"/><stop offset="1" stop-color="#14141b"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#b9bbd0"/><stop offset="1" stop-color="#4a4b5c"/>
    </linearGradient>
    <filter id="aura" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="b"/>
      <feFlood flood-color="#8f8bff" flood-opacity="0.6"/>
      <feComposite in2="b" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="spark" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#aura)"><path d="M64.0 6.0 L18.0 120.0 L4.0 120.0 Z" fill="url(#lite)" stroke="#101018" stroke-opacity="0.55" stroke-width="1.2" stroke-linejoin="round"/><path d="M64.0 6.0 L64.0 40.0 L32.0 120.0 L18.0 120.0 Z" fill="url(#dark)" stroke="#101018" stroke-opacity="0.55" stroke-width="1.2" stroke-linejoin="round"/><path d="M64.0 6.0 L110.0 120.0 L96.0 120.0 L64.0 40.0 Z" fill="url(#lite)" stroke="#101018" stroke-opacity="0.55" stroke-width="1.2" stroke-linejoin="round"/><path d="M64.0 6.0 L124.0 120.0 L110.0 120.0 Z" fill="url(#dark)" stroke="#101018" stroke-opacity="0.55" stroke-width="1.2" stroke-linejoin="round"/><path d="M64.0 64.0 L50.0 102.0 L64.0 96.0 Z" fill="url(#lite)" stroke="#101018" stroke-opacity="0.55" stroke-width="1.2" stroke-linejoin="round"/><path d="M64.0 64.0 L64.0 96.0 L78.0 102.0 Z" fill="url(#dark)" stroke="#101018" stroke-opacity="0.55" stroke-width="1.2" stroke-linejoin="round"/><g filter="url(#spark)"><path d="M64.0 73.0 L65.7 82.3 L75.0 84.0 L65.7 85.7 L64.0 95.0 L62.3 85.7 L53.0 84.0 L62.3 82.3 Z" fill="#ffffff"/></g></g>

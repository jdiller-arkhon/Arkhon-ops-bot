# One service per bot plus one shared PostgreSQL database.
# The Argus bot is added here by its own build step.
services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arkhon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arkhon}
      POSTGRES_DB: ${POSTGRES_DB:-arkhon_bots}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  ops:
    build:
      context: .
      dockerfile: bots/ops/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-arkhon}:${POSTGRES_PASSWORD:-arkhon}@postgres:5432/${POSTGRES_DB:-arkhon_bots}?schema=public
    ports:
      - '${WEBHOOK_PORT:-3000}:${WEBHOOK_PORT:-3000}'
    depends_on:
      postgres:
        condition: service_healthy

  certa:
    build:
      context: .
      dockerfile: bots/certa/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      WEBHOOK_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-arkhon}:${POSTGRES_PASSWORD:-arkhon}@postgres:5432/${POSTGRES_DB:-arkhon_bots}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
      # The Ops bot runs the PostgreSQL migrations for the shared schema first.
      ops:
        condition: service_started

volumes:
  pgdata:
